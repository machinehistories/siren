name: Build Grasshopper Plugin

on: [push, pull_request, release, workflow_dispatch]

jobs:

  build:
    
    name: "Build plugin"
    runs-on: windows-latest
    env:
      Solution_Name: Siren

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

    - name: Restore the project's packages
      run: msbuild Siren.sln /t:Restore /p:Configuration=Release

    - name: Build the project
      run: msbuild Siren.sln /p:Configuration=Release

    - name: Show build outputs (debug)
      run: |
        Write-Host "=== Listing all Release directories under repo ==="
        Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.Name -eq 'Release' } | Select-Object FullName
        Write-Host "=== List .gha and .dll files under bin/Release ==="
        Get-ChildItem -Path . -Recurse -File -Include *.gha,*.dll | Select-Object FullName
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grasshopper-plugin
        path: |
          **/bin/Release/**/*.gha
          **/bin/Release/**/*.dll
          **/bin/Release/**/*
        if-no-files-found: warn
