name: Build Grasshopper Plugin

on: [push, pull_request, release, workflow_dispatch]

jobs:

  build:
    
    name: "Build plugin"
    runs-on: windows-latest
    env:
      Solution_Name: ./Siren/Siren.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Restore the project's packages
      run: nuget restore $env:Solution_Name

    - name: Build the project
      run: msbuild $env:Solution_Name /p:Configuration=Release /p:Platform="Any CPU"

    - name: Debug - Check build output
      run: |
        Write-Host "=== Current Directory ==="
        Get-Location
        Write-Host ""
        Write-Host "=== All files in Siren/bin (if exists) ==="
        if (Test-Path "Siren/bin") {
          Get-ChildItem -Path "Siren/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Siren/bin directory does not exist!"
        }
        Write-Host ""
        Write-Host "=== All .gha and .dll files anywhere ==="
        Get-ChildItem -Path . -Recurse -File -Include "*.gha","*.dll" | ForEach-Object { Write-Host $_.FullName }
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grasshopper-plugin
        path: Siren/bin/
        if-no-files-found: warn
