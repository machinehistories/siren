name: Build Grasshopper Plugin

on: [push, pull_request, release, workflow_dispatch]

jobs:

  build:
    
    name: "Build plugin"
    runs-on: windows-latest
    env:
      Solution_Name: ./Siren/Siren.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Restore the project's packages
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Build the project
      run: msbuild $env:Solution_Name /p:Configuration=Release /v:diagnostic

    - name: Debug - List all bin directories and contents
      run: |
        Write-Host "=== Searching for all 'bin' directories ==="
        Get-ChildItem -Path . -Recurse -Directory -Name bin
        Write-Host ""
        Write-Host "=== Searching for all .gha files ==="
        Get-ChildItem -Path . -Recurse -File -Filter *.gha | ForEach-Object { Write-Host $_.FullName }
        Write-Host ""
        Write-Host "=== Searching for all .dll files ==="
        Get-ChildItem -Path . -Recurse -File -Filter *.dll | ForEach-Object { Write-Host $_.FullName }
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grasshopper-plugin
        path: |
          Siren/bin/
          **/bin/
        if-no-files-found: warn
